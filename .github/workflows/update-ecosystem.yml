name: Verify Ecosystem Index

on:
  push:
    branches:
      - main
    paths:
      - 'plugins/**'
      - 'README.md'
      - '.github/workflows/update-ecosystem.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'README.md'
      - '.github/workflows/update-ecosystem.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate ecosystem index
        run: python plugins/agent-extension-authoring/.apm/skills/authoring-plugins/scripts/update_ecosystem_index.py

      - name: Verify committed index is current
        run: |
          if ! git diff --exit-code -- README.md; then
            echo '::error::Regenerate README.md with update_ecosystem_index.py and include it in the source PR. Protected main is never written by this workflow.'
            exit 1
          fi
