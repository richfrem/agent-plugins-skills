name: dev-utils
version: 2.0.0
description: "Developer utilities: 8 self-contained skills. Manages GitHub issues (log, promote, rank, refactor proposals, resolution audits) and resolves them in isolated worktrees through PR closure; bundles code and docs for review; checks links; enforces coding conventions; manages ADRs, symlinks, and HuggingFace dataset/model transfers."
author: Richard Fremmerlid
kind: backend
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - bundle
  - adr
  - link_checker
  - github_issue
skills:
  - bundling-context
  - checking-links
  - enforcing-coding-conventions
  - managing-adrs
  - managing-github-issues
  - managing-huggingface-assets
  - managing-symlinks
  - resolving-github-issues
