  task pipeline with signed human approval gates and a gating switch (running-control-plane),
  project setup and signing-identity guidance (setting-up-agentic-os), and eval-gated
  skill improvement in an isolated lab (improving-skills-in-lab).'
author: Richard Fremmerlid
license: MIT
repository: https://github.com/richfrem/agent-plugins-skills
dependencies:
  apm:
    # running-control-plane finds orchestrating-agent-work (strategy registry, validators, graph runner) and
    # cli-agent (model catalogs) only as siblings installed by this package.
    - richfrem/agent-plugins-skills/plugins/agent-orchestration
