- transition_id: verify_exit_to_done
  from_state: VERIFY_EXIT
  to_state: DONE
  requires_cryptographic_proof: true
  purpose: 'DONE gate: confirm retrospective decision and close the task with a human signature.'
  next_steps_hint: 'First persist the completed retrospective through the supported record_retrospective wrapper with the
    required entry fields and resolved follow-ups; do this before requesting DONE. For STANDARD work, run the repository-wide
    pytest -q suite and record full_test_suite. For TRIVIAL work, record focused_test_suite instead unless the user requests
    or explicitly approves the full suite. Satisfy retrospective_done_guard (if it denies the request, the denial names the
    recovery). Then request closure: Human-signed closure. Run coordinate-transition --task-id <task-id> --to DONE. In an
    interactive terminal (--interactive) the CLI prints the exact challenge (task, transition, worktree commit SHA and diff
    hashes when a worktree is registered, and for normal completion the recorded retrospective decision and digest, nonce,
    expiry), runs ssh-keygen -Y sign so OpenSSH prompts for your private-key passphrase, verifies the signature against allowed_signers
    and consumes the request in the commit transaction. Without a terminal it stops with HUMAN_PROOF_REQUIRED and a request_id;
    the human then runs show-challenge, signs, and runs approve-transition. There is no force-close word, flag or prompt:
    closure of any task from any state takes the same signature.'
  checklist:
  - Current task state is persisted as VERIFY_EXIT
  - Retrospective survey is complete or explicitly skipped with a reason
  - 'Deterministic check satisfied: full_test_suite'
  required_artifacts: []
  deterministic_checks:
  - done_guard
  - implementation_completeness
  - full_test_suite_or_trivial_focused
  guidance:
    success: TRIVIAL closes with focused verification and the retrospective; STANDARD closes only after full-suite verification.
      Neither route may skip the user review or retrospective evidence.
    denial: Remain in VERIFY_EXIT until the route-appropriate verification receipt and retrospective decision are recorded.
  human_questions:
  - question_id: retrospective_decision
    question: Retrospective decision before closing the task (opt_in or skip)?
    options:
    - skip — close without additional retrospective follow-ups [Recommended]
    - opt_in — record retrospective findings and follow-ups
    default: skip — close without additional retrospective follow-ups [Recommended]
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited: []
  denial_message: 'Transition VERIFY_EXIT -> DONE denied: retrospective is incomplete or has unresolved issue follow-ups.'
  authority:
    type: cryptographic_proof
    explanation: Only a verified OpenSSH signature over a content-bound transition_request, consumed in the commit transaction,
      can commit this edge.
