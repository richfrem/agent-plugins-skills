session_change_control:
  applies_from: task_creation
  owner: controller
  worktree_first_invariant: From the first task/session mutation, the registered worktree is the authoritative location for
    all session-owned changes. Do not make direct main-checkout edits after the session baseline unless they are explicitly
    classified, reconciled, and copied into the worktree.
  session_baseline: Record the main checkout and registered worktree status before the first mutation, then preserve the baseline
    reference for the entire task.
  observation_loop:
    trigger: Any user or agent observation about execution friction, a contract defect, missing evidence, or a pipeline improvement,
      including observations made before implementation tasks formally begin.
    sequence:
    - record_observation
    - classify_observation
    - decide_immediate_fix_or_defer
    - update_ledger_and_plan_if_in_scope
    - apply_in_registered_worktree
    - run_focused_verification
    - record_evidence_and_resume_current_stage
    classifications:
    - in_scope_immediate_pipeline_fix
    - deferred_map_debt
    - material_scope_expansion
    - blocker
    immediate_fix_rule: An in-scope, non-destructive pipeline fix may be handled before formal implementation begins, but
      it must be recorded as a bounded task/plan delta, applied in the registered worktree, focused-tested, and included in
      the session-wide change inventory.
    approval_boundary: Material scope expansion, destructive action, authority change, or implementation outside the approved
      boundary requires human approval before action.
    status_reporting: Report pre-implementation fixes as pipeline observations handled; do not report implementation as started
      or complete solely because an observation was addressed.
    failure_recovery: If the observation cannot be classified or its worktree/ledger/evidence update cannot complete, record
      the exact blocker and recovery action, preserve the current lifecycle state, and do not silently continue.
  review_gate: Before any review submission, verify every session-owned change is present and content-matched in the registered
    worktree; classify generated metadata separately and fail closed on missing, mismatched, or unclassified implementation
    changes.
strategy_artifacts:
  triple-loop-learning:
    artifact: docs/plans/work-tasks/<task-id>/<task-id>-learning-contract.md
    required: false
review_selection_contract:
  id: review-selection-v1
  applies_to:
  - plan_review_to_multi_agent_review
  - worktree_review_to_multi_agent_code_review
  canonical_profile_path: context/agent-capability-profile.json
  environment_summary_fallback: context/memory/environment.md
  profile_owner: cli-agent
  profile_lifecycle:
    establish: Run the interactive cli-agent project-setup capability baseline (references/project-setup.md) once during project
      setup.
    consume: Pipeline review and implementation stages read the profile and current catalog references; they do not repeat
      deep environment analysis.
    refresh: If the profile is missing, partial, invalid, stale, or the user reports an environment change, route back to
      cli-agent project setup for the provider and model questions.
  availability_rule: Offer only runtimes and providers whose installation probe succeeds, whose subscription/account/license
    access is explicitly confirmed by the user, and whose project-use authorization is explicitly confirmed when applicable;
    never infer availability from the host agent, repository author, or a static option list.
  question_sequence:
  - review_decision
  - review_method
  - internal_runtime_model_effort
  internal_runtime_model_effort:
    applies_when: The selected review method is single-agent internal or multi-agent internal.
    question_policy: one_at_a_time
    sequence:
    - internal_cli_runtime
    - internal_model
    - internal_effort
    cli_runtime_question: Which available CLI/runtime should run the internal reviewers?
    model_question: Which model should the internal reviewers use?
    effort_question: Which effort level should the internal reviewers use?
    option_resolution:
      cli_runtime: Render only providers with available=true in context/agent-capability-profile.json; do not infer availability
        from installed binaries, the host agent, or a static option list.
      model: After the runtime is selected, render only model IDs and capability tiers from the cli-agent model catalogs for
        that runtime.
      effort: Render only effort levels supported by the selected runtime/model and current catalog.
    persistence: Persist the runtime, model, and effort answers before dispatch; never dispatch an internal reviewer with
      an inferred or default route.
  user_must_choose_internal_route: true
  human_answer_provenance:
    chat_answer: A user answer received in chat is a human decision. Persist it through coordinate-transition --interactive
      (or --answers paired with --human-confirmed on SOFT edges) so SQLite records actor=human.
    answers_flag: Do not use bare --answers (without --human-confirmed) to represent a human-gated answer; it records agent
      provenance and will be rejected by the SQLite human-decision trigger.
    scripted_use: Use bare --answers only for non-human scripted tests or explicitly agent-authored decisions on edges that
      permit them.
  internal_selection_rule: After the user selects an internal method, inspect the confirmed environment and current catalogs,
    recommend a proportional runtime/model/effort route, and ask the user to choose or confirm it. Do not dispatch an internal
    reviewer until that explicit user selection is recorded.
  premium_rule: A premium model or high-effort route requires explicit user confirmation even when recommended.
  catalog_authority_skill: cli-agent
  catalog_resolution:
    authority: cli-agent
    do_not_duplicate_catalogs: true
    instruction: Read cli-agent references/model-catalog-maintenance.md for current model IDs, capability tiers, pricing,
      catalog ownership, and synchronization rules.
    missing_catalog_rule: If the profile or required catalog cannot be resolved, report the exact missing path and route back
      to cli-agent project setup for refresh; do not invent model choices or dispatch.
  feedback_handoff:
    applies_to:
    - MULTI_AGENT_REVIEW
    - MULTI_AGENT_CODE_REVIEW
    sequence:
    - collect_each_reviewer_report
    - synthesize_one_canonical_round_brief
    - persist_raw_reports_and_synthesis
    - record_critic_outcome_and_exact_return_edge
    - if_changes_requested_transition_to_worktree_and_pass_revision_brief
    storage:
      raw_reports: Store each report under the task-scoped temp review directory, with reviewer, runtime, model, effort, and
        round in the filename or manifest.
      synthesis: Store one task-scoped synthesis/revision brief beside the raw reports; it is the implementer's only consolidated
        review input.
      durable_outcome: Persist the canonical PASS, REVISE, or REVIEW_FAILURE outcome and concise findings through the control-plane
        critic-review receipt, linked to the review iteration and report manifest.
    synthesis_rule: The orchestrator, not an individual reviewer, reconciles duplicate findings, preserves dissent, assigns
      severity, separates in-scope fixes from follow-up debt, and names the exact acceptance checks required before re-review.
    implementation_handoff: For REVISE or REQUEST_CHANGES, do not ask the reviewer to edit code and do not feed raw reports
      directly into an unrelated model. Transition to IN_WORKTREE and pass the canonical revision brief to the already-authorized
      implementation controller as a bounded fix prompt.
    re_review_rule: After the bounded fix prompt is completed, run focused verification and the session-wide change inventory,
      return through WORKTREE_REVIEW, and start a new review iteration with the same selection contract unless the user explicitly
      changes it.
    review_type_isolation:
      plan_review: MULTI_AGENT_REVIEW receipts concern the draft plan only. They may authorize a return to DRAFT_PLAN, but
        they never authorize implementation rework, satisfy code_review_or_skip, or count as an implementation-review round.
      implementation_review: MULTI_AGENT_CODE_REVIEW receipts concern the implementation in the registered worktree only.
        They may authorize the existing return to IN_WORKTREE for bounded fixes or the exit path after PASS.
      round_numbering: Maintain separate plan-review and implementation-review iteration counters; do not call an implementation
        review round 2 merely because plan review reached iteration 2.
      rework_gate: Do not transition MULTI_AGENT_CODE_REVIEW to IN_WORKTREE without a current implementation-review receipt
        whose verdict is REQUEST_CHANGES, REVISE, or REVIEW_FAILURE with bounded recovery.
      human_transition_gate: After the current implementation-review synthesis and revision brief are recorded, ask the human
        whether to transition back to IN_WORKTREE. Do not begin fixes or treat the rework transition as implicitly approved.
stages:
  INTAKE:
    purpose: Capture the minimum understanding needed before selecting the next lifecycle path.
    question_policy: one_at_a_time
    intent_first: true
    canonical_questions_are_coverage_prompts: true
    adaptation_guidance:
      principle: Understand the desired work; do not conduct a literal questionnaire.
      ask_only_unresolved: true
      allow_combined_answers: true
      allow_rephrased_questions: true
      allow_not_applicable_with_rationale: true
      allow_contextual_follow_ups: true
      preserve_canonical_ids: true
      no_inferred_answers: true
      approval_and_authority_are_always_explicit: true
    approver_identity:
      rule: Before the first interview question, state which identity approves this pipeline and confirm it with the human.
      one_approver_per_pipeline: true
      default: human_operator
      enforced_by: scripts/control_plane/approver_policy.py (by database file; the first signed gate fixes the task's approver
        key)
      human_operator: Real work lives in the repository's context/control_plane.db and is approved (Gate 1 APPROVED, Gate
        3 VERIFY_EXIT, DONE) only with the human operator's own enrolled signing key. The agent's simulation key is refused
        there under any alias.
      agent_simulation: Simulations run in a separate database file named simulation_control_plane.db. There only the agent's
        simulation key (enrolled as test-human@local) approves and the human's key is refused. Real-work gates never read
        that file.
      push_guard: Before a push, the push guard (verify_gate_evidence.py, shipped with the running-control-plane skill) re-verifies
        every signed gate of the task against context/identity/allowed_signers (human keys only, one key); a simulation database
        copied or symlinked into context/control_plane.db cannot unlock it.
      never: Never run a simulation against context/control_plane.db, never sign on the human's behalf, and never remove or
        overwrite either identity in allowed_signers; the two identities coexist.
    plan_outline:
      enabled: true
      purpose: Capture the plan-ready bullets discovered during the interview before drafting the full plan.
      update_after_each_answer: true
      user_visibility: Show a concise outline summary or a link to the current outline; do not make the user reconstruct it
        from chat.
      artifact_path: docs/plans/work-tasks/<task-id>/<task-id>-plan-outline.md
      link_rule: When the outline artifact exists, provide its repository-relative clickable path in the response.
      bullet_types:
      - purpose
      - desired_user_outcome
      - scope_boundary
      - success_evidence
      - constraint_or_authority
      - risk_or_open_question
      - decision
      outline_is_not_approval: true
      draft_plan_source: The completed outline is the primary interview input for the initial draft plan.
    intent_coverage:
    - intent_id: classification
      canonical_question_id: interview_classification
      purpose: Choose the proportionate lifecycle route.
    - intent_id: problem
      canonical_question_id: interview_summary
      purpose: Understand the desired outcome and why it matters.
    - intent_id: scope
      canonical_question_id: interview_scope
      purpose: Define included behavior, boundaries, and exclusions.
    - intent_id: verification
      canonical_question_id: interview_verification
      purpose: Define observable evidence of correctness.
    - intent_id: acceptance
      canonical_question_id: interview_acceptance_criteria
      purpose: Define constraints and acceptance conditions for standard work.
    progress_display:
      enabled: true
      count_adaptive_questions: true
      format: Interview question {current} of {total}
      include_remaining_summary: true
    entry_questions:
    - question_id: interview_classification
      question: 'Is this a trivial fix or a standard task? Note: TRIVIAL does NOT skip pipeline stages -- it only lightens
        evidence at each stage (focused verification, no external reviewers, concise plan). There is no INTAKE/INTERVIEW ->
        DONE shortcut edge; the only such edges are the human_force_done_* force-close family, requiring live interactive
        human authorization. If a change is small enough that even the lightened full sequence is disproportionate, the correct
        choice is to skip this control plane entirely (direct commit/push with the user''s explicit authorization), not to
        answer TRIVIAL expecting a shortcut through it.'
      options:
      - TRIVIAL
      - STANDARD
      default: STANDARD
    - question_id: interview_summary
      question: What problem are we solving, in your own words?
      options: []
      default: ''
    - question_id: interview_scope
      question: What files, skills, or behavior are in scope, and what is explicitly out of scope?
      options: []
      default: ''
    - question_id: interview_verification
      question: What observable result will prove the work is correct?
      options: []
      default: ''
    adaptive_follow_up_rules:
    - rule_id: trivial_change_evidence
      when:
        question_id: interview_classification
        equals: TRIVIAL
      questions:
      - question_id: interview_trivial_evidence
        question: What is the smallest change, and what diff or test reference proves it?
        options: []
        default: ''
    - rule_id: standard_acceptance_detail
      when:
        question_id: interview_classification
        equals: STANDARD
      questions:
      - question_id: interview_acceptance_criteria
        question: What acceptance criteria and constraints must the implementation satisfy?
        options: []
        default: ''
      - question_id: interview_planning_model_effort
        question: For the upcoming planning phase, what model and effort level would you like to choose? The interviewer will
          first classify the planning problem as low, medium or high complexity, inspect your available tools, recommend a
          cost/effort route, and explain the tradeoff. You may confirm the recommendation or choose another supported option.
        options: []
        default: ''
        selection_mode: confirm_or_change
        recommendation_source: model_effort_guidance
        recommendation_phase: plan
        availability_sources:
        - running-control-plane
        - cli-agent
        complexity_options:
          low:
            recommended_cost_tier: low
            recommended_effort: low
            guidance: Use the cheapest capable available model; premium planning is unnecessary.
          medium:
            recommended_cost_tier: medium
            recommended_effort: medium
            guidance: Use a competent mid-tier model unless ambiguity or risk warrants more.
          high:
            recommended_cost_tier: high
            recommended_effort: medium
            guidance: Prefer a highly capable model such as Astra at medium effort; consider capable alternatives available
              to the user.
        undersized_choice_guidance: If the user selects a low-tier or low-effort route for a high-complexity plan, advise
          that it may reduce plan quality and ask whether to continue; defer to the user.
        premium_confirmation_required: true
    exit_requirements:
    - A concise plan outline is persisted and reviewable before the initial draft plan is compiled.
    - Every required intent area has a recorded coverage disposition: direct answer, combined answer, authorized source answer,
        explicit not-applicable rationale, or focused adaptive follow-up.
    - Canonical question IDs remain traceable in the coverage record; the user is not required to hear redundant literal wording.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - All generated follow-up questions have an answer or an explicit human refusal.
    - The agent has not inferred an answer on the user's behalf.
  PLAN_REVIEW:
    purpose: 'The human decides about the authored or revised plan: accept and advance, request revisions, or optionally dispatch
      an independent review.'
    question_policy: one_at_a_time
    entry_questions: []
    adaptive_follow_up_rules: []
    exit_requirements:
    - "The human either accepted the plan (request Gate 1: PLAN_REVIEW -> APPROVED), requested revisions (return to DRAFT_PLAN), or requested an adversarial plan audit inside PLAN_REVIEW (plan_audit.py / signed_decisions)."
    guidance:
      summary: Adversarial plan review runs inside PLAN_REVIEW (no separate state). When the human accepts the plan, request
        Gate 1 (PLAN_REVIEW -> APPROVED) with coordinate-transition --to APPROVED so it halts on HUMAN_PROOF_REQUIRED for the
        human's OpenSSH signature.
      next_steps:
      - Ask the human in chat if they accept the plan, want changes, or want an adversarial plan audit (plan_audit.py).
      - If accepted, run coordinate-transition --to APPROVED (halts on HUMAN_PROOF_REQUIRED; hand the human show-challenge /
        ssh-keygen -Y sign / approve-transition).
      - If changes requested, run coordinate-transition --to DRAFT_PLAN.
      - If review requested, run the adversarial plan audit inside PLAN_REVIEW and record findings before requesting APPROVED.
  IN_WORKTREE:
    purpose: Execute the approved implementation in the registered isolated worktree.
    question_policy: one_at_a_time
    entry_questions: []
    adaptive_follow_up_rules: []
    status_display:
      enabled: true
      lifecycle_states:
      - queued
      - in_progress
      - blocked
      - complete
      format: 'Implementation status: {status}; agent: {agent}; model: {model}; effort: {effort}; worktree: {worktree}'
      unknown_value: unobserved
      user_summary_rule: Always tell the user whether implementation has started, which agent/runtime/model/effort is active
        when known, and the next gate; never imply completion from worktree creation alone.
    delegation_display:
      required_after_worktree_entry: true
      fields:
      - agent_count
      - assignments
      - runtime
      - model
      - effort
      - scope
      - status
      - started_at
      user_summary_template: 'Implementation delegation: {agent_count} agent(s); assignments: {assignments}; runtime: {runtime};
        model: {model}; effort: {effort}; scope: {scope}; status: {status}; started: {started_at}.'
      dispatch_truth_rule: Do not report implementation as started until at least one authorized agent dispatch is observed;
        worktree creation alone is queued preparation.
    implementation_kickoff:
      mandatory_after_entry: true
      runtime_entrypoint: ControlPlane.create_implementation_controller(...).run()
      runtime_enforcement: Use ImplementationController.run_verification() for focused, integration, and final-suite commands;
        the cadence guard rejects out-of-order or duplicate final-suite runs.
      do_not_wait_for_repeated_user_prompt: true
      ownership: After APPROVED -> IN_WORKTREE, the implementation controller owns the work package until exit verification
        or an explicit blocker.
      pipeline_gate_policy: Do not request lifecycle transitions for internal task dispatch, task review, or bounded fix rounds.
        Return to the pipeline only for exit verification, retrospective, or a human-authorized abort.
      continuation_loop: dispatch -> observe -> review -> fix/re-dispatch -> scoped re-review; continue automatically while
        authorized and within the review bound.
      idle_rule: 'Never leave an authorized work package silently idle: dispatch the next legal internal action, or record
        BLOCKED with the exact blocker and next action.'
      authorization_scope: APPROVED -> IN_WORKTREE authorizes the complete bounded implementation loop, including internal
        dispatches, reviews, and fix rounds, until exit verification or a genuine blocker. Do not ask the user to re-authorize
        these internal steps.
      user_prompt_boundary: Do not pause for routine progress confirmation. Prompt the user only for a new material scope,
        destructive action, premium-model authorization not already recorded, unresolved blocker, or the post-implementation
        review/exit gate.
      required_preflight:
      - Probe the active runtime's native planning, worktree, and subagent capabilities; use a native facility only when explicitly
        reported, otherwise use the portable fallback.
      - Read the approved specification, implementation plan, and task ledger.
      - Verify the registered worktree contains or can safely access the approved artifacts and required source baseline.
      - Create or resume a persistent implementation ledger before dispatch.
      - Select the least costly model and effort that meet each task's complexity and the user's recorded tool availability.
      required_execution:
      - Split the approved ledger into bounded implementation tasks.
      - Dispatch one or more authorized implementer agents when tasks are independently reviewable; otherwise dispatch one
        integration implementer.
      - Record each dispatch with agent/runtime/model/effort/scope/start time before telling the user implementation is in_progress.
      - Review each completed task before dispatching dependent work; these are internal session events, not lifecycle transitions.
      blocked_behavior: If source baseline, approved artifacts, model authorization, or a security/destructive gate prevents
        dispatch, report status blocked with the exact blocker and next safe action; do not silently remain queued.
      model_effort_rule: Reuse an explicitly selected implementation model/effort for the same approved scope. Otherwise recommend
        and select a proportional supported route; seek confirmation only for a premium model, materially broader scope, or
        a new review round.
      cost_control_rule: Use the least-cost capable route for each bounded task. Do not interrupt an active high-risk slice
        solely to change models; at the next verified checkpoint, prefer Luna medium (or the user's equivalent mid-tier tool)
        for independent review and routine fixes. Reserve premium models for high-complexity planning, architecture, or unresolved
        correctness risk.
      quota_awareness_rule: Before dispatch, report the selected model, effort, complexity rationale, and known quota/reset
        constraint. If the active quota is low, prefer a cheaper capable route or defer non-urgent review until reset; never
        claim a reset time not observed from the runtime.
      test_cadence_rule: For each micro-slice, run only focused tests covering the changed contract. Run the subsystem suite
        at an integration checkpoint and the full plugin suite only once before the P01 acceptance gate or equivalent release
        checkpoint; do not repeat long full-suite runs after every small edit unless a focused failure requires it.
      subagent_review_test_sequence: 'Subagents must follow this order: focused tests for the slice; independent agent review
        after implementation; bounded fix/re-review rounds for findings; then one final full test and parity check before
        acceptance. A passing slice test is not an acceptance result, and a full-suite run does not replace independent review.'
      simulator_acceptance_rule: Any new lifecycle or authorization contract must add simulator scenarios before acceptance.
        The final check must execute the acceptance matrix through production ControlPlane/TransitionCoordinator paths, including
        every wildcard/override edge, normal-path preservation, authorized success, unauthorized denial, persistence consumption,
        and error contract; simulator success is required evidence, not optional regression coverage.
      session_continuity_rule: Keep the implementing agent session alive through bounded review-fix rounds whenever the runtime
        supports continuation. Relay concrete reviewer findings into that same session immediately; do not close and reopen
        the implementation context for ordinary corrections. Independent reviews must be narrowly targeted to the changed
        contract and acceptance matrix.
      user_update_rule: Immediately after entry, report queued preparation. Immediately after the first dispatch, report in_progress
        with the delegation summary. After each task boundary, report completed/reviewed/blocked work and the next dispatch
        or gate.
    exit_requirements:
    - Implementation evidence and tests are recorded before reporting complete.
    - The implementation plan contains a fenced JSON Implementation Task Ledger with every in-scope task COMPLETE, evidence,
      and existing artifact paths before exit verification.
    - Active model and effort are reported from observed runtime metadata, not inferred from task title.
    completion_contract:
      definition: Implementation is complete when the approved bounded work package is written in the registered worktree,
        the focused acceptance checks pass, and the implementation ledger records the evidence. This status does not mean
        committed, pushed, merged, or DONE.
      authority: The registered worktree is the review source of truth. The main checkout is not an independent implementation
        authority and may contain pre-existing or mirrored task changes.
      session_change_inventory:
        mandatory: true
        run_on_every_session: true
        run_before_every_review_submission: true
        run_after_every_internal_fix_round: true
        reminder: At every implementation checkpoint, compare the session-start baseline, main checkout, and registered worktree
          path by path. Ensure every file created or modified by this session is present with the intended content in the
          registered worktree before reporting implementation complete or requesting WORKTREE_REVIEW.
        ownership_rule: A path changed after the session baseline is session-owned unless it is explicitly recorded as pre-existing.
          A session-owned main-only path is a blocker; it must not be classified as main_only_preexisting.
        required_fields:
        - session_baseline_reference
        - path
        - session_owned
        - main_status
        - worktree_status
        - content_match
        - disposition
        failure_rule: Do not report completion or enter WORKTREE_REVIEW while any session-owned change is absent or mismatched
          in the registered worktree.
        recovery: Synchronize the missing session-owned change into the registered worktree using the approved file/symlink
          workflow, rerun focused verification, and repeat the inventory until it passes. Preserve unrelated main changes.
        comparison_policy:
          implementation_files: Require byte-identical intended content between main and the registered worktree.
          generated_metadata: Allow regenerated installer metadata to differ only in expected timestamps or source-location
            bookkeeping; verify semantic entries and record the difference.
          missing_or_unclassified: Always fail closed.
      reconciliation_manifest:
        required_before_integration: true
        purpose: Reconcile the common base, task baseline, registered worktree, and main checkout before applying any reviewed
          patch.
        classifications:
        - worktree_only
        - main_only_preexisting
        - shared_task_change
        - generated_metadata
        - untracked
        required_fields:
        - path
        - common_base_blob_or_status
        - task_baseline_status
        - worktree_status
        - main_status
        - classification
        - disposition
      integration_contract:
        review_source: registered_worktree
        apply_reviewed_patch_once: true
        preserve_main_only_preexisting_changes: true
        commit_policy: After WORKTREE_REVIEW, final verification, and the DONE operation gate, integrate the reviewed worktree
          patch once into the authorized integration checkout and create one commit. Do not commit both the worktree branch
          and main independently.
        push_policy: Push only the verified integration commit after explicit human authorization at the push/DONE boundary;
          never push from IN_WORKTREE or WORKTREE_REVIEW.
      recovery: If reconciliation finds conflicting task changes, missing worktree artifacts, or unclassified files, remain
        in the current gate, record the exact paths and classification failure, and resolve or explicitly exclude them before
        integration.
  VERIFY_EXIT:
    purpose: Capture the complete pipeline-close survey before allowing DONE.
    question_policy: one_at_a_time
    entry_questions:
    - question_id: retrospective_workflow_complete
      question: Did the run complete the full intended workflow end to end?
      options:
      - true
      - false
      default: false
    - question_id: retrospective_human_rescue
      question: Did the run require major human rescue?
      options:
      - true
      - false
      default: false
    - question_id: retrospective_uncertainty_count
      question: How many times did the agent not know what to do next?
      options: []
      default: '0'
    - question_id: retrospective_skipped_step_count
      question: How many times did the agent miss or skip a required step?
      options: []
      default: '0'
    - question_id: retrospective_cli_error_count
      question: How many times did the agent use the wrong CLI syntax?
      options: []
      default: '0'
    - question_id: retrospective_redirect_count
      question: How many times was the agent redirected by a human?
      options: []
      default: '0'
    - question_id: retrospective_uncertainty_point
      question: At what point was the agent most uncertain about what to do next?
      options: []
      default: ''
    - question_id: retrospective_ambiguity
      question: Which instruction, rule, or workflow step felt ambiguous or underspecified?
      options: []
      default: ''
    - question_id: retrospective_confusing_tool
      question: Which command, tool, or template was most confusing in practice?
      options: []
      default: ''
    - question_id: retrospective_biggest_friction
      question: What was the single biggest source of friction in this run?
      options: []
      default: ''
    - question_id: retrospective_avoidable_failure
      question: Which failure felt avoidable with a better prompt, skill, or rule?
      options: []
      default: ''
    - question_id: retrospective_smallest_improvement
      question: What smallest workflow change would have improved this run most?
      options: []
      default: ''
    - question_id: retrospective_next_change
      question: What one change should be tested before the next run?
      options: []
      default: ''
    - question_id: retrospective_evidence
      question: What evidence from this run supports that change?
      options: []
      default: ''
    - question_id: retrospective_target
      question: Is the target of that change a skill, prompt, script, or rule?
      options:
      - Skill
      - Prompt
      - Script
      - Rule
      default: Skill
    adaptive_follow_up_rules:
    - rule_id: confirmed_follow_up_issue
      when:
        question_id: retrospective_next_change
        not_empty: true
      questions:
      - question_id: retrospective_issue_worthy
        question: Is this follow-up worthy of a tracked issue?
        options:
        - true
        - false
        default: false
    exit_requirements:
    - Every entry question has an answer.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - Issue-worthy follow-ups are confirmed and tracked before DONE.
    - The final complete-or-skip decision is asked only after this survey is complete.
    closeout_change_control:
      mandatory_before_done: true
      classifications:
      - already_resolved_in_current_package
      - bounded_fix_requires_rework_loop
      - larger_follow_up_requires_issue_or_new_work_package
      bounded_fix_rule: A bounded fix is never applied directly from VERIFY_EXIT -- it requires returning through the rework
        loop (IN_WORKTREE/WORKTREE_REVIEW) like any other implementation change.
      no_legal_return_rule: VERIFY_EXIT has no legal implementation return edge in the canonical DAG -- a genuine bounded
        fix requires an explicit human-approved recovery re-entry into IN_WORKTREE, not a silent exception.
      larger_follow_up_rule: Before opening a new issue or work package for a larger follow-up, run a duplicate search against
        existing open issues and map-debt entries covering the same root cause.
      agent_self_assessment:
        mandatory_before_done: true
        question: For each retrospective finding, is this a safe bounded fix now, or does it need a separate follow-up?
        response_policy: Record an explicit classification for every finding before DONE -- do not silently drop a finding
          without one.
        no_silent_action: true
  DONE:
    purpose: Confirm the human's git-integration intent for the verified worktree before any commit, push, or PR discussion,
      per worktree-lifecycle-management.md's six-state vocabulary.
    question_policy: one_at_a_time
    entry_questions:
    - question_id: done_git_integration_authorization
      question: Do you want to begin Git integration now (commit on the existing registered feature branch), or leave the
        verified changes as-is in the current worktree?
      options:
      - Yes, begin Git integration [Recommended]
      - No, leave the verified changes in the current worktree
      default: Yes, begin Git integration [Recommended]
    adaptive_follow_up_rules: []
    exit_requirements:
    - The git-integration authorization question has been answered.
    closeout_contract:
      feature_branch_policy: Reuse the task's existing registered feature branch (worktree_branch) -- never create a new branch
        at DONE, and never commit directly to main.
      commit_policy: Create exactly one commit for the verified work, with an evolution-check/map-debt reference per the Evolution
        Integrity Gate, before any push is discussed.
      push_policy: Ask separately, as an explicit isolated instruction, before running git push -- committing and pushing
        are never bundled into one authorization.
      post_done_protocol:
        overview: 'When DONE is signed, the task lifecycle in SQLite is complete. The final repository convergence sequence
          follows: DONE -> Push Worktree Branch -> PR / Merge to Main -> Sync Main Locally -> Prune Worktree & Branch.'
        steps:
        - step: 1
          name: push_worktree_branch
          execution_class: SOFT
          instruction: 'Ask the human in chat: ''Task is marked DONE. Would you like me to push <worktree_branch> and create
            the pull request to main?'' Upon confirmation, run `git push origin <worktree_branch>` and update SQLite worktree
            state to pushed_to_origin via `agent_control.py update-worktree`.'
        - step: 2
          name: create_pull_request
          execution_class: SOFT
          instruction: Open the PR via `gh pr create --base main --head <worktree_branch> ...`. State the PR URL and 'not
            yet merged', and await the user's review/merge on GitHub.
        - step: 3
          name: sync_local_main
          execution_class: AGENT
          instruction: 'Once merged into origin/main, checkout main in the repository root and pull: `cd <repo_root> && git
            checkout main && git pull origin main`. Update SQLite worktree state to merged_into_origin_main.'
        - step: 4
          name: prune_worktree_and_branch
          execution_class: AGENT
          instruction: 'Verify clean state on main, then remove the worktree and delete the local task branch: `git worktree
            remove .worktrees/<task-id> && git branch -d <worktree_branch>`.'
intake_guidance:
  source_documents:
    authorization_required: true
    inferred_answers_require_confirmation: true
    documents_cannot_grant_approval: true
    resume_confirmed_answers: true
  review_rounds:
    ceilings_minutes:
      QUICK: 5
      STANDARD: 15
      SIGNIFICANT: 30
    shared_whole_round_budget: true
    timeout_status: partial_timeout
  precompletion_summary:
    machine_gate:
      audience: internal
      preserve_fields: true
      evaluate_all_checks: true
    user_summary:
      audience: user
      plain_language: true
      hide_machine_gate_details: true
      explain_map_debt_as: a follow-up the agents recorded for later improvement
      say_whether_user_action_is_needed: true
      ask_one_question_at_a_time: true
      ask_only_if_human_decision_is_required: true
      user_rule: Tell the user what was checked, whether anything blocks the next step, and the single next question or action
        in plain language.
    internal_follow_up:
      if_any_check_is_yes: Handle the result internally as FIX, MAP_DEBT, or ESCALATE; do not turn the machine checklist into
        a user questionnaire.
human_recovery:
  enabled: true
  source_states: Any canonical state
  target_states: Any different canonical state
  evidence: Requires a consumed, human-authored APPROVAL decision bound to the exact current occupancy transition_id -- this
    occupancy binding is what distinguishes a genuine human recovery from a replayed or stale approval.
  reentry_rule: Re-entering a state via human recovery restores that state's normal capabilities only -- it does not grant
    downstream capability that the destination state would not otherwise release, and does not retroactively authorize any
    transition beyond this one.
  safety_boundary: Recovery targets must be canonical states; unknown states are always rejected regardless of any recorded
    human approval, since an unknown state has no defined capability or gate contract to enforce.
execution_guidance:
  work_package:
    advisory: true
    required_fields: &id001
    - objective
    - scope_boundary
    - prerequisites
    - authority
    - expected_artifacts
    - validation_command
    - completion_evidence
    - handoff_condition
    - failure_recovery
    instruction: Define the approved work-package outcome, boundaries, delegated authority, artifacts, validation, handoff,
      and recovery before executing its tasks.
  task:
    advisory: true
    required_fields: *id001
    instruction: Execute one bounded task from the work package; preserve its scope, use the approved authority, produce its
      named artifacts, run its validation, and report completion or recovery evidence.
  slice:
    advisory: true
    required_fields: *id001
    instruction: Treat each slice as a small independently verifiable increment; state its prerequisites, implement only its
      boundary, validate it, and hand off only with the required evidence.
  transition:
    advisory: true
    required_fields: *id001
    instruction: Before each lifecycle transition, resolve the edge guidance, satisfy its questions and checks through the
      supported mechanism, and use the success or denial recovery path without treating advisory text as authority. A human
      answer received in chat must be persisted through --interactive, never --answers, so SQLite records actor=human. After
      a human answer is accepted, immediately persist the decision, complete the requested transition, load the destination
      state's stage contract, and ask its next question or execute its deterministic handoff; never stop after merely acknowledging
      an answer.
  execution_step:
    advisory: true
    required_fields: *id001
    instruction: Perform the next concrete command or edit only after confirming its prerequisite; record the expected artifact
      or test evidence and stop for a gate, failure, or scope change.
model_effort_guidance:
  interview:
    recommended_model: current-user-model
    recommended_effort: low
    reason: Intake answers are bounded; reuse authorized source answers and ask only unresolved questions.
    requires_confirmation_for_premium: true
  plan:
    recommended_model: user-selected-planning-model
    recommended_effort: high
    reason: Planning resolves architecture and acceptance evidence; a premium model may be useful but requires explicit confirmation.
    requires_confirmation_for_premium: true
  review:
    recommended_model: user-selected-review-model
    recommended_effort: medium
    reason: Independent review should be proportionate to risk and may use a different model from planning.
    requires_confirmation_for_premium: true
  implementation:
    recommended_model: user-selected-implementation-model
    recommended_effort: medium
    reason: Implementation should use the least costly supported route that meets the evidence contract; after a premium checkpoint,
      use a mid-tier model such as Luna medium for review and routine fixes when risk permits.
    requires_confirmation_for_premium: true
templates:
- transition_id: intake_to_draft_plan
  from_state: INTAKE
  to_state: DRAFT_PLAN
  purpose: Confirm the drafted plan outline (classification, summary, scope, verification, acceptance) and enter DRAFT_PLAN.
  next_steps_hint: 'Complete this edge''s checklist and required gates, then run: @AGENT_CONTROL_CMD@ coordinate-transition
    --task-id <task-id> --to DRAFT_PLAN.'
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to DRAFT_PLAN is legal
  required_artifacts: []
  deterministic_checks:
  - prior_art_scan
  human_questions:
  - question_id: intake_outline_confirmation
    question: Do you confirm the plan outline drafted from the brief (classification, summary, scope, verification, acceptance)?
    options:
    - Confirm outline and enter DRAFT_PLAN [Recommended]
    - Revise outline before drafting
    default: Confirm outline and enter DRAFT_PLAN [Recommended]
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - plan_write
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> DRAFT_PLAN denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to DRAFT_PLAN is deterministically governed by automated checks and artifacts.
- transition_id: intake_to_escalated
  from_state: INTAKE
  to_state: ESCALATED
  purpose: Escalate task from INTAKE due to blocking failure, unresolvable ambiguity, or user intervention.
  next_steps_hint: 'Complete this edge''s checklist and required gates, then run: @AGENT_CONTROL_CMD@ coordinate-transition
    --task-id <task-id> --to ESCALATED.'
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to ESCALATED is legal
  required_artifacts: []
  deterministic_checks: []
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited: []
  denial_message: 'Transition INTAKE -> ESCALATED denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to ESCALATED is deterministically governed by automated checks and artifacts.
- transition_id: draft_plan_to_plan_review
  from_state: DRAFT_PLAN
  to_state: PLAN_REVIEW
  purpose: Submit the drafted spec, implementation plan, and strategy artifact to PLAN_REVIEW.
  guidance:
    success: For TRIVIAL work, submit the concise plan for user review and use focused review evidence; skip independent reviewers
      unless the user requests them or risk warrants escalation. STANDARD work retains the normal review-selection contract
      and must declare an execution strategy (direct, dual-loop, graph, agent-swarm, red-team-review, learning-loop, or triple-loop-learning)
      and compile its corresponding plan artifact before submitting to PLAN_REVIEW.
    denial: Keep the task in DRAFT_PLAN until the route-appropriate plan artifact is complete.
  next_steps_hint: 'The plan is drafted. This is a SOFT edge: (1) In chat, ask the human: ''Would you like to submit the drafted
    plan for review?''. (2) Once the human approves in chat, YOU run: @AGENT_CONTROL_CMD@ coordinate-transition --task-id
    <task-id> --to PLAN_REVIEW --human-confirmed ''HUMAN-CONFIRMED: <quote>''. If submitted, PLAN_REVIEW separately asks whether
    agents should review the draft and, when requested, which supported review method to use. Explicit review skips and plan
    revisions use their own target-specific transitions. No plan-review choice approves implementation.'
  checklist:
  - Current task state is persisted as DRAFT_PLAN
  - Structural DAG transition from DRAFT_PLAN to PLAN_REVIEW is legal
  required_artifacts:
  - docs/plans/work-tasks/<task-id>/<task-id>-spec.md
  - docs/plans/work-tasks/<task-id>/<task-id>-implementation-plan.md
  deterministic_checks: []
  human_questions: []
  approval:
    required: false
    approver_role: agent
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition DRAFT_PLAN -> PLAN_REVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_review
    explanation: Entry into PLAN_REVIEW requires human confirmation of review scope and artifacts.
- transition_id: plan_review_to_approved
  from_state: PLAN_REVIEW
  to_state: APPROVED
  requires_cryptographic_proof: true
  purpose: 'Gate 1: human-signed approval of the reviewed spec, plan, manifest (if any), and review verdict.'
  guidance:
    success: TRIVIAL and STANDARD both require explicit implementation approval here. This is the capability boundary that
      releases worktree/code access; do not infer it from plan acceptance.
    denial: Without explicit implementation approval, remain pre-worktree regardless of task size.
  next_steps_hint: Human-signed gate. Run coordinate-transition --task-id <task-id> --to APPROVED. In an interactive terminal
    (--interactive) the CLI prints the exact challenge (task, transition, hashes of the reviewed spec and plan, nonce, expiry),
    runs ssh-keygen -Y sign so OpenSSH prompts for your private-key passphrase, verifies the signature against allowed_signers
    and consumes the request in the commit transaction. Without a terminal it stops with HUMAN_PROOF_REQUIRED and a request_id;
    the human then runs agent_control.py show-challenge --request-id N, signs, and runs approve-transition --request-id N.
    No prompt, typed word, --answers, --human-confirmed or flag can authorize this edge.
  checklist:
  - Current task state is persisted as PLAN_REVIEW
  - Structural DAG transition from PLAN_REVIEW to APPROVED is legal
  - 'Deterministic check satisfied: main_clean_before_approval'
  required_artifacts: []
  deterministic_checks:
  - main_clean_before_approval
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - push branch to origin
  denial_message: 'Transition PLAN_REVIEW -> APPROVED denied: preconditions or required decisions not satisfied.'
  authority:
    type: cryptographic_proof
    explanation: Only a verified OpenSSH signature over a content-bound transition_request, consumed in the commit transaction,
      can commit this edge.
- transition_id: plan_review_to_draft_plan
  from_state: PLAN_REVIEW
  to_state: DRAFT_PLAN
  purpose: Advance lifecycle state from PLAN_REVIEW to DRAFT_PLAN upon satisfying phase requirements and verifications.
  next_steps_hint: 'Return to DRAFT_PLAN to revise the plan artifacts. A later review submission must have a changed artifact
    identity or a matching plan_artifact_revision receipt. Then run: @AGENT_CONTROL_CMD@ coordinate-transition --task-id <task-id>
