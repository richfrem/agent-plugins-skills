- transition_id: approved_to_in_worktree
  from_state: APPROVED
  to_state: IN_WORKTREE
  purpose: Create isolated git worktree and begin test-first implementation.
  guidance:
    success: TRIVIAL uses one bounded implementation slice and focused verification only. Run the full suite only when the
      user requests it or the changed surface makes focused verification insufficient. STANDARD follows its approved verification
      scope.
    denial: Do not create a worktree or edit production code before the approved boundary and isolation checks pass.
  next_steps_hint: 'Gate 1 approve-transition already recorded human_approval. Create or select an isolated feature worktree
    and branch, record both with update-worktree, and run: @AGENT_CONTROL_CMD@ coordinate-transition --task-id <task-id> --to
    IN_WORKTREE. The transition itself auto-reconciles any dirty source-checkout changes into the worktree (main_worktree_reconciliation
    deterministic check) — do not manually claim pre-worktree changes were carried over; the check does this by code and fails
    closed on any unresolved conflict. After entry, report the required delegation summary: agent count, assignments, runtime,
    model, effort, scope, status, and start time. State queued until an authorized agent dispatch is observed; then state
    in_progress. Worktree creation alone is not implementation completion. If the user explicitly authorizes implementation
    in the existing checkout, record it with record-receipt --gate existing_worktree_exception --cmd approved-existing-checkout:<approver>
    --exit-code 0 before transitioning.'
  checklist:
  - Current task state is persisted as APPROVED
  - 'Deterministic check satisfied: human_approval'
  required_artifacts: []
  deterministic_checks:
  - human_approval
  - worktree_isolation_or_exception
  - main_worktree_reconciliation
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - push branch to origin without review pass
  - merge into origin/main directly
  denial_message: 'Transition APPROVED -> IN_WORKTREE denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from APPROVED to IN_WORKTREE is deterministically governed by automated checks and artifacts.
- transition_id: in_worktree_to_worktree_review
  from_state: IN_WORKTREE
  to_state: WORKTREE_REVIEW
  purpose: Implementation is complete in the registered worktree; submit the bounded, verified worktree diff to WORKTREE_REVIEW.
  guidance:
    success: For TRIVIAL work, present the focused diff and focused test result to the user; defer broad/full-suite testing
      unless requested or required by affected-surface risk. STANDARD retains its approved test-suite contract.
    denial: Keep implementation bounded and add only the focused evidence needed for the approved change.
  next_steps_hint: 'Implementation is complete only after the approved work package is written and focused verification passes;
    it is not committed, pushed, merged, or DONE. Before every review submission and after every internal fix round, run the
    session-wide change inventory and ensure every session-owned file is present and content-matched in the registered worktree.
    The test_suite_or_deferred_to_review deterministic check runs before this edge''s own questions are ever presented, so
    it must be satisfied by a receipt recorded BEFORE calling coordinate-transition, not by answering confirm_test_suite_or_defer
    in the same call: run @AGENT_CONTROL_CMD@ record-receipt --task-id <task-id> --gate test_suite --cmd ''<the pytest command
    actually run>'' --exit-code 0 --human-confirmed ''HUMAN-CONFIRMED: <quote>'' if the suite already passed, or the same
    command with --gate test_suite_deferred_to_review if deferring to the later WORKTREE_REVIEW/VERIFY_EXIT gate instead.
    Before integration, create the reconciliation manifest required by the IN_WORKTREE completion contract, classify worktree-only,
    main-only-preexisting, shared-task, and untracked paths, then apply the reviewed worktree patch once. After review and
    final verification, run: @AGENT_CONTROL_CMD@ coordinate-transition --task-id <task-id> --to WORKTREE_REVIEW.'
  checklist:
  - Current task state is persisted as IN_WORKTREE
  - 'Deterministic check satisfied: test_suite_or_deferred_to_review'
  required_artifacts:
  - docs/plans/work-tasks/<task-id>/<task-id>-spec.md
