  purpose: Synthesize interview requirements into architectural specification and task implementation plan.
  next_steps_hint: "Record the standard interview answers through the supported interview-question mechanism, including acceptance criteria; defaults are not inferred. Then satisfy interview_standard_complete with verify-interview-question, record-plan-mode-entry or record-socratic-intake as applicable, and run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to DRAFT_PLAN."
