  next_steps_hint: "STOP: do NOT run `pytest` directly by itself, and do NOT call the individual verifier wrappers one at a time -- a bare pytest run records no receipt, and calling verifiers separately is exactly the slow, error-prone path this hint used to describe (verifier_id=pytest_full_suite, verifier_id=pytest_unit_tests, verifier_id=leak_check, each a separate call). Use the single bundled wrapper instead, which runs all 3 verifiers plus the required asymmetric-persistence log entry in ONE call and fails fast on the first real failure: (1) Confirm docs/plans/work-tasks/<task-id>/<task-id>-implementation-plan.md has a fenced JSON Implementation Task Ledger with every item status=COMPLETE, evidence, and existing artifact paths -- this satisfies implementation_completeness (the bundle does not check this one). (2) Run: python3 plugins/agent-agentic-os/scripts/control_plane/wrappers/run_verify_exit_bundle.py --task-id <task-id> --destination references/map-debt.md --details '<what was logged and why>' -- this alone satisfies full_test_suite, test_suite, leak_check, and done_guard's asymmetric-persistence requirement (default destination is references/map-debt.md; use wiki/decisions/<task-id>.md instead if that's where you logged it). (3) Only after that reports status=COMPLETED: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to RETROSPECTIVE --human-confirmed 'HUMAN-CONFIRMED: <what the human actually said>'."
