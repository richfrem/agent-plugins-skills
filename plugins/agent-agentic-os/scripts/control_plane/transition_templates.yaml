stages:
  INTERVIEW:
    purpose: Capture the minimum understanding needed before selecting the next lifecycle path.
    question_policy: one_at_a_time
    entry_questions:
    - question_id: interview_classification
      question: Is this a trivial fix or a standard task?
      options:
      - TRIVIAL
      - STANDARD
      default: STANDARD
    - question_id: interview_summary
      question: What problem are we solving, in your own words?
      options: []
      default: ''
    - question_id: interview_scope
      question: What files, skills, or behavior are in scope, and what is explicitly out of scope?
      options: []
      default: ''
    - question_id: interview_verification
      question: What observable result will prove the work is correct?
      options: []
      default: ''
    adaptive_follow_up_rules:
    - rule_id: trivial_change_evidence
      when:
        question_id: interview_classification
        equals: TRIVIAL
      questions:
      - question_id: interview_trivial_evidence
        question: What is the smallest change, and what diff or test reference proves it?
        options: []
        default: ''
    - rule_id: standard_acceptance_detail
      when:
        question_id: interview_classification
        equals: STANDARD
      questions:
      - question_id: interview_acceptance_criteria
        question: What acceptance criteria and constraints must the implementation satisfy?
        options: []
        default: ''
    exit_requirements:
    - Every entry question has an answer.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - All generated follow-up questions have an answer or an explicit human refusal.
    - The agent has not inferred an answer on the user's behalf.
  RETROSPECTIVE:
    purpose: Capture the complete pipeline-close survey before allowing DONE.
    question_policy: one_at_a_time
    entry_questions:
    - question_id: retrospective_workflow_complete
      question: Did the run complete the full intended workflow end to end?
      options:
      - Yes
      - No
      default: No
    - question_id: retrospective_human_rescue
      question: Did the run require major human rescue?
      options:
      - Yes
      - No
      default: No
    - question_id: retrospective_uncertainty_count
      question: How many times did the agent not know what to do next?
      options: []
      default: '0'
    - question_id: retrospective_skipped_step_count
      question: How many times did the agent miss or skip a required step?
      options: []
      default: '0'
    - question_id: retrospective_cli_error_count
      question: How many times did the agent use the wrong CLI syntax?
      options: []
      default: '0'
    - question_id: retrospective_redirect_count
      question: How many times was the agent redirected by a human?
      options: []
      default: '0'
    - question_id: retrospective_uncertainty_point
      question: At what point was the agent most uncertain about what to do next?
      options: []
      default: ''
    - question_id: retrospective_ambiguity
      question: Which instruction, rule, or workflow step felt ambiguous or underspecified?
      options: []
      default: ''
    - question_id: retrospective_confusing_tool
      question: Which command, tool, or template was most confusing in practice?
      options: []
      default: ''
    - question_id: retrospective_biggest_friction
      question: What was the single biggest source of friction in this run?
      options: []
      default: ''
    - question_id: retrospective_avoidable_failure
      question: Which failure felt avoidable with a better prompt, skill, or rule?
      options: []
      default: ''
    - question_id: retrospective_smallest_improvement
      question: What smallest workflow change would have improved this run most?
      options: []
      default: ''
    - question_id: retrospective_next_change
      question: What one change should be tested before the next run?
      options: []
      default: ''
    - question_id: retrospective_evidence
      question: What evidence from this run supports that change?
      options: []
      default: ''
    - question_id: retrospective_target
      question: Is the target of that change a skill, prompt, script, or rule?
      options:
      - Skill
      - Prompt
      - Script
      - Rule
      default: Skill
    adaptive_follow_up_rules:
    - rule_id: confirmed_follow_up_issue
      when:
        question_id: retrospective_next_change
        not_empty: true
      questions:
      - question_id: retrospective_issue_worthy
        question: Is this follow-up worthy of a tracked issue?
        options:
        - Yes
        - No
        default: No
    exit_requirements:
    - Every entry question has an answer.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - Issue-worthy follow-ups are confirmed and tracked before DONE.
    - The final complete-or-skip decision is asked only after this survey is complete.

execution_guidance:
  work_package:
    advisory: true
    required_fields: &execution_guidance_fields
    - objective
    - scope_boundary
    - prerequisites
    - authority
    - expected_artifacts
    - validation_command
    - completion_evidence
    - handoff_condition
    - failure_recovery
    instruction: Define the approved work-package outcome, boundaries, delegated authority, artifacts, validation, handoff, and recovery before executing its tasks.
  task:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Execute one bounded task from the work package; preserve its scope, use the approved authority, produce its named artifacts, run its validation, and report completion or recovery evidence.
  slice:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Treat each slice as a small independently verifiable increment; state its prerequisites, implement only its boundary, validate it, and hand off only with the required evidence.
  transition:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Before each lifecycle transition, resolve the edge guidance, satisfy its questions and checks through the supported mechanism, and use the success or denial recovery path without treating advisory text as authority. After a human answer is accepted, immediately persist the decision, complete the requested transition, load the destination state's stage contract, and ask its next question or execute its deterministic handoff; never stop after merely acknowledging an answer.
  execution_step:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Perform the next concrete command or edit only after confirming its prerequisite; record the expected artifact or test evidence and stop for a gate, failure, or scope change.

templates:
- transition_id: intake_to_interview
  from_state: INTAKE
  to_state: INTERVIEW
  purpose: Begin interactive requirements capture and Socratic defaulting with human user.
  next_steps_hint: "First satisfy prior_art_scan; use: log-prior-art --task-id <task-id>. Then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to INTERVIEW."
  guidance:
    success: "After prior-art evidence is recorded, enter INTERVIEW to collect the user's requirements one question at a time."
    helper_commands:
    - "python3 plugins/agent-agentic-os/scripts/agent_control.py log-prior-art --task-id <task-id> --summary '<summary>'"
  checklist:
  - Current task state is persisted as INTAKE
  - 'Deterministic check satisfied: prior_art_scan'
  required_artifacts: []
  deterministic_checks:
  - prior_art_scan
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - interview_question
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> INTERVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to INTERVIEW is deterministically governed by automated checks and artifacts.
- transition_id: interview_to_retrospective_trivial
  from_state: INTERVIEW
  to_state: RETROSPECTIVE
  purpose: Fast-track a TRIVIAL-classified task from the interview gate to the mandatory pipeline-close retrospective gate.
  next_steps_hint: "First record every listed stage_question_id (interview_classification, interview_summary, interview_scope, interview_verification, and interview_trivial_evidence) through the supported interview-question mechanism; defaults are not inferred. Then satisfy interview_trivial_complete with verify-interview-question, answer this edge's confirm_interview_complete question interactively, and run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to RETROSPECTIVE."
  checklist:
  - Current task state is persisted as INTERVIEW
  - Every listed stage_question_id has a recorded answer for this INTERVIEW occupancy
  - Human has completed the INTERVIEW stage-entry questions and applicable follow-ups
  required_artifacts: []
  deterministic_checks:
  - interview_trivial_complete
  stage_question_ids:
  - interview_classification
  - interview_summary
  - interview_scope
  - interview_verification
  - interview_trivial_evidence
  stage_route:
    question_id: interview_classification
    equals: TRIVIAL
  human_questions:
  - question_id: confirm_interview_complete
    question: Confirm the INTERVIEW baseline questions and applicable follow-ups are complete?
    options:
    - Yes [Recommended]
    - No, continue the interview
    default: Yes [Recommended]
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - retrospective_capture
  capabilities_prohibited:
  - push branch to origin
  denial_message: 'Transition INTERVIEW -> RETROSPECTIVE (trivial) denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_decision
    explanation: A human must confirm that the stage-entry interview is complete before the task enters the mandatory retrospective gate.
- transition_id: intake_to_draft_plan
  from_state: INTAKE
  to_state: DRAFT_PLAN
  purpose: Advance lifecycle state from INTAKE to DRAFT_PLAN upon satisfying phase requirements and verifications.
  next_steps_hint: "Complete this edge's checklist and required gates, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to DRAFT_PLAN."
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to DRAFT_PLAN is legal
  required_artifacts:
  - docs/plans/<task-id>-spec.md
  - docs/plans/<task-id>-implementation-plan.md
  deterministic_checks: []
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> DRAFT_PLAN denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to DRAFT_PLAN is deterministically governed by automated checks and artifacts.
# Plan-review entry edges intentionally use a binary submit/revise question:
# they decide whether the current artifacts are ready for that review state.
# The 5-way review-method questions belong only to edges that select a review
# method or permit an explicit review skip, not to plan-review entry.
