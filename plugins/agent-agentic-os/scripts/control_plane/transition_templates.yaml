  purpose: Submit the authored plan to the PLAN_REVIEW disposition-and-acceptance gate.
  next_steps_hint: "Submit both plan artifacts; the coordinator records their content identity atomically. At PLAN_REVIEW, ask the required decision: do you want additional independent review, yes or no? No records the zero-review path and continues to plan acceptance; yes continues to PLAN_REVIEW -> MULTI_AGENT_REVIEW, where the review method is selected. After every review round, return to PLAN_REVIEW and ask whether further plan changes are required; repeat review as needed or accept the plan. Then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to PLAN_REVIEW."
