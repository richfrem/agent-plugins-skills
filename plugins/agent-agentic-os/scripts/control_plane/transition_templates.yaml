templates:
- transition_id: intake_to_interview
  from_state: INTAKE
  to_state: INTERVIEW
  purpose: Begin interactive requirements capture and Socratic defaulting with human user.
  checklist:
  - Current task state is persisted as INTAKE
  - 'Deterministic check satisfied: prior_art_scan'
  required_artifacts: []
  deterministic_checks:
  - prior_art_scan
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - interview_question
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> INTERVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to INTERVIEW is deterministically governed by automated checks and artifacts.
- transition_id: intake_to_done_trivial
  from_state: INTAKE
  to_state: DONE
  purpose: Fast-track a TRIVIAL-classified task (single-file/few-line, no architectural impact) directly to completion, skipping interview, spec/plan compilation, multi-agent review, and worktree isolation.
  checklist:
  - Current task state is persisted as INTAKE
  - Human has confirmed TRIVIAL classification with a stated reason and diff reference
  required_artifacts: []
  deterministic_checks: []
  human_questions:
  - question_id: triage_classification
    question: 'Confirm TRIVIAL classification: state the reason and a diff reference (e.g. "fix typo in error message, files=1, diff=<short sha or `git diff --stat` one-liner>").'
    options: []
    default: ''
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - modify production code
  - commit_to_branch
  capabilities_prohibited:
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> DONE (trivial) denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_decision
    explanation: A human must confirm the TRIVIAL classification and state a reason before the task can skip the full interview/spec/review/worktree pipeline.
- transition_id: intake_to_draft_plan
  from_state: INTAKE
  to_state: DRAFT_PLAN
  purpose: Advance lifecycle state from INTAKE to DRAFT_PLAN upon satisfying phase requirements and verifications.
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to DRAFT_PLAN is legal
  required_artifacts:
  - docs/plans/<task-id>-spec.md
  - docs/plans/<task-id>-implementation-plan.md
