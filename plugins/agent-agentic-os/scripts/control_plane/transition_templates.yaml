stages:
  INTERVIEW:
    purpose: Capture the minimum understanding needed before selecting the next lifecycle path.
    question_policy: one_at_a_time
    progress_display:
      enabled: true
      count_adaptive_questions: true
      format: "Interview question {current} of {total}"
      include_remaining_summary: true
    entry_questions:
    - question_id: interview_classification
      question: Is this a trivial fix or a standard task?
      options:
      - TRIVIAL
      - STANDARD
      default: STANDARD
    - question_id: interview_summary
      question: What problem are we solving, in your own words?
      options: []
      default: ''
    - question_id: interview_scope
      question: What files, skills, or behavior are in scope, and what is explicitly out of scope?
      options: []
      default: ''
    - question_id: interview_verification
      question: What observable result will prove the work is correct?
      options: []
      default: ''
    adaptive_follow_up_rules:
    - rule_id: trivial_change_evidence
      when:
        question_id: interview_classification
        equals: TRIVIAL
      questions:
      - question_id: interview_trivial_evidence
        question: What is the smallest change, and what diff or test reference proves it?
        options: []
        default: ''
    - rule_id: standard_acceptance_detail
      when:
        question_id: interview_classification
        equals: STANDARD
      questions:
      - question_id: interview_acceptance_criteria
        question: What acceptance criteria and constraints must the implementation satisfy?
        options: []
        default: ''
      - question_id: interview_planning_model_effort
        question: >-
          For the upcoming planning phase, what model and effort level would you
          like to choose? The interviewer will first classify the planning
          problem as low, medium or high complexity, inspect your available
          tools, recommend a cost/effort route, and explain the tradeoff. You
          may confirm the recommendation or choose another supported option.
        options: []
        default: ''
        selection_mode: confirm_or_change
        recommendation_source: model_effort_guidance
        recommendation_phase: plan
        availability_sources:
        - os-init
        - project-setup
        - cli-agents
        complexity_options:
          low:
            recommended_cost_tier: low
            recommended_effort: low
            guidance: Use the cheapest capable available model; premium planning is unnecessary.
          medium:
            recommended_cost_tier: medium
            recommended_effort: medium
            guidance: Use a competent mid-tier model unless ambiguity or risk warrants more.
          high:
            recommended_cost_tier: high
            recommended_effort: medium
            guidance: Prefer a highly capable model such as Astra at medium effort; consider capable alternatives available to the user.
        undersized_choice_guidance: If the user selects a low-tier or low-effort route for a high-complexity plan, advise that it may reduce plan quality and ask whether to continue; defer to the user.
        premium_confirmation_required: true
    exit_requirements:
    - Every entry question has an answer.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - All generated follow-up questions have an answer or an explicit human refusal.
    - The agent has not inferred an answer on the user's behalf.
  IN_WORKTREE:
    purpose: Execute the approved implementation in the registered isolated worktree.
    question_policy: one_at_a_time
    entry_questions: []
    adaptive_follow_up_rules: []
    status_display:
      enabled: true
      lifecycle_states:
      - queued
      - in_progress
      - blocked
      - complete
      format: "Implementation status: {status}; agent: {agent}; model: {model}; effort: {effort}; worktree: {worktree}"
      unknown_value: "unobserved"
      user_summary_rule: Always tell the user whether implementation has started, which agent/runtime/model/effort is active when known, and the next gate; never imply completion from worktree creation alone.
    delegation_display:
      required_after_worktree_entry: true
      fields:
      - agent_count
      - assignments
      - runtime
      - model
      - effort
      - scope
      - status
      - started_at
      user_summary_template: "Implementation delegation: {agent_count} agent(s); assignments: {assignments}; runtime: {runtime}; model: {model}; effort: {effort}; scope: {scope}; status: {status}; started: {started_at}."
      dispatch_truth_rule: Do not report implementation as started until at least one authorized agent dispatch is observed; worktree creation alone is queued preparation.
    implementation_kickoff:
      mandatory_after_entry: true
      runtime_entrypoint: "ControlPlane.create_implementation_controller(...).run()"
      runtime_enforcement: "Use ImplementationController.run_verification() for focused, integration, and final-suite commands; the cadence guard rejects out-of-order or duplicate final-suite runs."
      do_not_wait_for_repeated_user_prompt: true
      ownership: "After APPROVED -> IN_WORKTREE, the implementation controller owns the work package until exit verification or an explicit blocker."
      pipeline_gate_policy: "Do not request lifecycle transitions for internal task dispatch, task review, or bounded fix rounds. Return to the pipeline only for exit verification, retrospective, or a human-authorized abort."
      continuation_loop: "dispatch -> observe -> review -> fix/re-dispatch -> scoped re-review; continue automatically while authorized and within the review bound."
      idle_rule: "Never leave an authorized work package silently idle: dispatch the next legal internal action, or record BLOCKED with the exact blocker and next action."
      authorization_scope: "APPROVED -> IN_WORKTREE authorizes the complete bounded implementation loop, including internal dispatches, reviews, and fix rounds, until exit verification or a genuine blocker. Do not ask the user to re-authorize these internal steps."
      user_prompt_boundary: "Do not pause for routine progress confirmation. Prompt the user only for a new material scope, destructive action, premium-model authorization not already recorded, unresolved blocker, or the post-implementation review/exit gate."
      required_preflight:
      - Probe the active runtime's native planning, worktree, and subagent capabilities; use a native facility only when explicitly reported, otherwise use the portable fallback.
      - Read the approved specification, implementation plan, and task ledger.
      - Verify the registered worktree contains or can safely access the approved artifacts and required source baseline.
      - Create or resume a persistent implementation ledger before dispatch.
      - Select the least costly model and effort that meet each task's complexity and the user's recorded tool availability.
      required_execution:
      - Split the approved ledger into bounded implementation tasks.
      - Dispatch one or more authorized implementer agents when tasks are independently reviewable; otherwise dispatch one integration implementer.
      - Record each dispatch with agent/runtime/model/effort/scope/start time before telling the user implementation is in_progress.
      - Review each completed task before dispatching dependent work; these are internal session events, not lifecycle transitions.
      blocked_behavior: If source baseline, approved artifacts, model authorization, or a security/destructive gate prevents dispatch, report status blocked with the exact blocker and next safe action; do not silently remain queued.
      model_effort_rule: Reuse an explicitly selected implementation model/effort for the same approved scope. Otherwise recommend and select a proportional supported route; seek confirmation only for a premium model, materially broader scope, or a new review round.
      cost_control_rule: "Use the least-cost capable route for each bounded task. Do not interrupt an active high-risk slice solely to change models; at the next verified checkpoint, prefer Luna medium (or the user's equivalent mid-tier tool) for independent review and routine fixes. Reserve premium models for high-complexity planning, architecture, or unresolved correctness risk."
      quota_awareness_rule: "Before dispatch, report the selected model, effort, complexity rationale, and known quota/reset constraint. If the active quota is low, prefer a cheaper capable route or defer non-urgent review until reset; never claim a reset time not observed from the runtime."
      test_cadence_rule: "For each micro-slice, run only focused tests covering the changed contract. Run the subsystem suite at an integration checkpoint and the full plugin suite only once before the P01 acceptance gate or equivalent release checkpoint; do not repeat long full-suite runs after every small edit unless a focused failure requires it."
      subagent_review_test_sequence: "Subagents must follow this order: focused tests for the slice; independent agent review after implementation; bounded fix/re-review rounds for findings; then one final full test and parity check before acceptance. A passing slice test is not an acceptance result, and a full-suite run does not replace independent review."
      simulator_acceptance_rule: "Any new lifecycle or authorization contract must add simulator scenarios before acceptance. The final check must execute the acceptance matrix through production ControlPlane/TransitionCoordinator paths, including every wildcard/override edge, normal-path preservation, authorized success, unauthorized denial, persistence consumption, and error contract; simulator success is required evidence, not optional regression coverage."
      session_continuity_rule: "Keep the implementing agy or Claude session alive through bounded review-fix rounds whenever the runtime supports continuation. Relay concrete reviewer findings into that same session immediately; do not close and reopen the implementation context for ordinary corrections. Independent reviews must be narrowly targeted to the changed contract and acceptance matrix."
      user_update_rule: Immediately after entry, report queued preparation. Immediately after the first dispatch, report in_progress with the delegation summary. After each task boundary, report completed/reviewed/blocked work and the next dispatch or gate.
    exit_requirements:
    - Implementation evidence and tests are recorded before reporting complete.
    - The implementation plan contains a fenced JSON Implementation Task Ledger with every in-scope task COMPLETE, evidence, and existing artifact paths before exit verification.
    - Active model and effort are reported from observed runtime metadata, not inferred from task title.
  RETROSPECTIVE:
    purpose: Capture the complete pipeline-close survey before allowing DONE.
    question_policy: one_at_a_time
    entry_questions:
    - question_id: retrospective_workflow_complete
      question: Did the run complete the full intended workflow end to end?
      options:
      - Yes
      - No
      default: No
    - question_id: retrospective_human_rescue
      question: Did the run require major human rescue?
      options:
      - Yes
      - No
      default: No
    - question_id: retrospective_uncertainty_count
      question: How many times did the agent not know what to do next?
      options: []
      default: '0'
    - question_id: retrospective_skipped_step_count
      question: How many times did the agent miss or skip a required step?
      options: []
      default: '0'
    - question_id: retrospective_cli_error_count
      question: How many times did the agent use the wrong CLI syntax?
      options: []
      default: '0'
    - question_id: retrospective_redirect_count
      question: How many times was the agent redirected by a human?
      options: []
      default: '0'
    - question_id: retrospective_uncertainty_point
      question: At what point was the agent most uncertain about what to do next?
      options: []
      default: ''
    - question_id: retrospective_ambiguity
      question: Which instruction, rule, or workflow step felt ambiguous or underspecified?
      options: []
      default: ''
    - question_id: retrospective_confusing_tool
      question: Which command, tool, or template was most confusing in practice?
      options: []
      default: ''
    - question_id: retrospective_biggest_friction
      question: What was the single biggest source of friction in this run?
      options: []
      default: ''
    - question_id: retrospective_avoidable_failure
      question: Which failure felt avoidable with a better prompt, skill, or rule?
      options: []
      default: ''
    - question_id: retrospective_smallest_improvement
      question: What smallest workflow change would have improved this run most?
      options: []
      default: ''
    - question_id: retrospective_next_change
      question: What one change should be tested before the next run?
      options: []
      default: ''
    - question_id: retrospective_evidence
      question: What evidence from this run supports that change?
      options: []
      default: ''
    - question_id: retrospective_target
      question: Is the target of that change a skill, prompt, script, or rule?
      options:
      - Skill
      - Prompt
      - Script
      - Rule
      default: Skill
    adaptive_follow_up_rules:
    - rule_id: confirmed_follow_up_issue
      when:
        question_id: retrospective_next_change
        not_empty: true
      questions:
      - question_id: retrospective_issue_worthy
        question: Is this follow-up worthy of a tracked issue?
        options:
        - Yes
        - No
        default: No
    exit_requirements:
    - Every entry question has an answer.
    - Every adaptive rule matching the recorded answers has been evaluated.
    - Issue-worthy follow-ups are confirmed and tracked before DONE.
    - The final complete-or-skip decision is asked only after this survey is complete.

intake_guidance:
  source_documents:
    authorization_required: true
    inferred_answers_require_confirmation: true
    documents_cannot_grant_approval: true
    resume_confirmed_answers: true
  review_rounds:
    ceilings_minutes: {QUICK: 5, STANDARD: 15, SIGNIFICANT: 30}
    shared_whole_round_budget: true
    timeout_status: partial_timeout
  precompletion_summary:
    user_rule: Explain map debt as agent follow-up, including whether the user must act now.
model_effort_guidance:
  interview:
    recommended_model: current-user-model
    recommended_effort: low
    requires_confirmation_for_premium: true
  plan:
    recommended_model: user-selected-planning-model
    recommended_effort: medium
    requires_confirmation_for_premium: true
  review:
    recommended_model: user-selected-review-model
    recommended_effort: medium
    requires_confirmation_for_premium: true
execution_guidance:
  work_package:
    advisory: true
    required_fields: &execution_guidance_fields
    - objective
    - scope_boundary
    - prerequisites
    - authority
    - expected_artifacts
    - validation_command
    - completion_evidence
    - handoff_condition
    - failure_recovery
    instruction: Define the approved work-package outcome, boundaries, delegated authority, artifacts, validation, handoff, and recovery before executing its tasks.
  task:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Execute one bounded task from the work package; preserve its scope, use the approved authority, produce its named artifacts, run its validation, and report completion or recovery evidence.
  slice:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Treat each slice as a small independently verifiable increment; state its prerequisites, implement only its boundary, validate it, and hand off only with the required evidence.
  transition:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Before each lifecycle transition, resolve the edge guidance, satisfy its questions and checks through the supported mechanism, and use the success or denial recovery path without treating advisory text as authority. After a human answer is accepted, immediately persist the decision, complete the requested transition, load the destination state's stage contract, and ask its next question or execute its deterministic handoff; never stop after merely acknowledging an answer.
  execution_step:
    advisory: true
    required_fields: *execution_guidance_fields
    instruction: Perform the next concrete command or edit only after confirming its prerequisite; record the expected artifact or test evidence and stop for a gate, failure, or scope change.

model_effort_guidance:
  interview:
    recommended_model: current-user-model
    recommended_effort: low
    reason: Intake answers are bounded; reuse authorized source answers and ask only unresolved questions.
    requires_confirmation_for_premium: true
  plan:
    recommended_model: user-selected-planning-model
    recommended_effort: high
    reason: Planning resolves architecture and acceptance evidence; a premium model may be useful but requires explicit confirmation.
    requires_confirmation_for_premium: true
  review:
    recommended_model: user-selected-review-model
    recommended_effort: medium
    reason: Independent review should be proportionate to risk and may use a different model from planning.
    requires_confirmation_for_premium: true
  implementation:
    recommended_model: user-selected-implementation-model
    recommended_effort: medium
    reason: Implementation should use the least costly supported route that meets the evidence contract; after a premium checkpoint, use a mid-tier model such as Luna medium for review and routine fixes when risk permits.
    requires_confirmation_for_premium: true

templates:
- transition_id: intake_to_interview
  from_state: INTAKE
  to_state: INTERVIEW
  purpose: Begin interactive requirements capture and Socratic defaulting with human user.
  next_steps_hint: "First satisfy prior_art_scan; use: log-prior-art --task-id <task-id>. Then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to INTERVIEW."
  guidance:
    success: "After prior-art evidence is recorded, enter INTERVIEW to collect the user's requirements one question at a time."
    helper_commands:
    - "python3 plugins/agent-agentic-os/scripts/agent_control.py log-prior-art --task-id <task-id> --summary '<summary>'"
  checklist:
  - Current task state is persisted as INTAKE
  - 'Deterministic check satisfied: prior_art_scan'
  required_artifacts: []
  deterministic_checks:
  - prior_art_scan
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - interview_question
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> INTERVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to INTERVIEW is deterministically governed by automated checks and artifacts.
- transition_id: interview_to_retrospective_trivial
  from_state: INTERVIEW
  to_state: RETROSPECTIVE
  purpose: Fast-track a TRIVIAL-classified task from the interview gate to the mandatory pipeline-close retrospective gate.
  next_steps_hint: "First record every listed stage_question_id (interview_classification, interview_summary, interview_scope, interview_verification, and interview_trivial_evidence) through the supported interview-question mechanism; defaults are not inferred. Then satisfy interview_trivial_complete with verify-interview-question, answer this edge's confirm_interview_complete question interactively, and run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to RETROSPECTIVE."
  checklist:
  - Current task state is persisted as INTERVIEW
  - Every listed stage_question_id has a recorded answer for this INTERVIEW occupancy
  - Human has completed the INTERVIEW stage-entry questions and applicable follow-ups
  required_artifacts: []
  deterministic_checks:
  - interview_trivial_complete
  stage_question_ids:
  - interview_classification
  - interview_summary
  - interview_scope
  - interview_verification
  - interview_trivial_evidence
  stage_route:
    question_id: interview_classification
    equals: TRIVIAL
  human_questions:
  - question_id: confirm_interview_complete
    question: Confirm the INTERVIEW baseline questions and applicable follow-ups are complete?
    options:
    - Yes [Recommended]
    - No, continue the interview
    default: Yes [Recommended]
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - retrospective_capture
  capabilities_prohibited:
  - push branch to origin
  denial_message: 'Transition INTERVIEW -> RETROSPECTIVE (trivial) denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_decision
    explanation: A human must confirm that the stage-entry interview is complete before the task enters the mandatory retrospective gate.
- transition_id: intake_to_draft_plan
  from_state: INTAKE
  to_state: DRAFT_PLAN
  purpose: Advance lifecycle state from INTAKE to DRAFT_PLAN upon satisfying phase requirements and verifications.
  next_steps_hint: "Complete this edge's checklist and required gates, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to DRAFT_PLAN."
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to DRAFT_PLAN is legal
  required_artifacts:
  - docs/plans/<task-id>-spec.md
  - docs/plans/<task-id>-implementation-plan.md
  deterministic_checks: []
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> DRAFT_PLAN denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to DRAFT_PLAN is deterministically governed by automated checks and artifacts.
# Plan-review entry edges intentionally use a binary submit/revise question:
# they decide whether the current artifacts are ready for that review state.
# The 5-way review-method questions belong only to edges that select a review
# method or permit an explicit review skip, not to plan-review entry.
- transition_id: intake_to_plan_review
  from_state: INTAKE
  to_state: PLAN_REVIEW
  purpose: Advance lifecycle state from INTAKE to PLAN_REVIEW upon satisfying phase requirements and verifications.
  next_steps_hint: "Answer this edge's YAML questions with --interactive or --answers '<json>'. Complete this edge's checklist and required gates, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to PLAN_REVIEW."
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to PLAN_REVIEW is legal
  required_artifacts:
  - docs/plans/<task-id>-spec.md
  - docs/plans/<task-id>-implementation-plan.md
  deterministic_checks: []
  human_questions:
  - question_id: confirm_review_intake_to_plan_review
    question: Submit artifacts for review in PLAN_REVIEW?
    options:
    - Proceed with review [Recommended]
    - Continue revising prior stage
    default: Proceed with review [Recommended]
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> PLAN_REVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_review
    explanation: Entry into PLAN_REVIEW requires human confirmation of review scope and artifacts.
- transition_id: intake_to_escalated
  from_state: INTAKE
  to_state: ESCALATED
  purpose: Escalate task from INTAKE due to blocking failure, unresolvable ambiguity, or user intervention.
  next_steps_hint: "Complete this edge's checklist and required gates, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to ESCALATED."
  checklist:
  - Current task state is persisted as INTAKE
  - Structural DAG transition from INTAKE to ESCALATED is legal
  required_artifacts: []
  deterministic_checks: []
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited: []
  denial_message: 'Transition INTAKE -> ESCALATED denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to ESCALATED is deterministically governed by automated checks and artifacts.
- transition_id: interview_to_draft_plan
  from_state: INTERVIEW
