  from_state: "*"
  to_state: INTAKE
  purpose: Recover a task whose control-plane record has drifted or desynced from reality (e.g. a raw write bypassing the normal transition path) by resetting it to INTAKE for a full re-run through every gate.
  next_steps_hint: "Answer this edge's YAML questions with --interactive or --answers '<json>'. Complete this edge's checklist and required gates, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to INTAKE."
  checklist:
  - Current task state is not INTAKE
  - Human has provided a genuine, interactive justification for the reset
  required_artifacts: []
  deterministic_checks: []
  human_questions:
  - question_id: reset_justification
    question: 'Justify this RESET to INTAKE (e.g. "control-plane record drifted from actual progress after a raw write bypassed the normal transition path; resetting to re-run the full pipeline").'
    options: []
    default: ''
  approval:
    required: true
    approver_role: human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition to INTAKE (reset) denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_decision
    explanation: A human must provide a genuine, interactive justification before a drifted task record can be reset to INTAKE.
