  next_steps_hint: "First satisfy prior_art_scan; use: log-prior-art --task-id <task-id>. Then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to INTERVIEW."
  guidance:
    success: "After prior-art evidence is recorded, enter INTERVIEW to collect the user's requirements one question at a time."
    helper_commands:
    - "python3 plugins/agent-agentic-os/scripts/agent_control.py log-prior-art --task-id <task-id> --summary '<summary>'"
  checklist:
  - Current task state is persisted as INTAKE
  - 'Deterministic check satisfied: prior_art_scan'
  required_artifacts: []
  deterministic_checks:
  - prior_art_scan
  human_questions: []
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - interview_question
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition INTAKE -> INTERVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: deterministic
    explanation: Transition from INTAKE to INTERVIEW is deterministically governed by automated checks and artifacts.
- transition_id: force_retrospective_from_interview
  from_state: INTERVIEW
  to_state: RETROSPECTIVE
  purpose: Human-authorized emergency close -- force any in-progress task directly to the mandatory retrospective gate from INTERVIEW, bypassing the normal interview-completeness gate, when the session is being ended before natural completion.
  next_steps_hint: "Answer force_retrospective_authorization interactively with the literal value FORCE_RETROSPECTIVE, then run: python3 plugins/agent-agentic-os/scripts/agent_control.py coordinate-transition --task-id <task-id> --to RETROSPECTIVE."
  checklist:
  - Current task state is persisted as INTERVIEW
  - Human has explicitly authorized an emergency close via FORCE_RETROSPECTIVE
  required_artifacts: []
  deterministic_checks: []
  stage_question_ids: []
  human_questions:
  - question_id: force_retrospective_reason_category
    question: Why is this task moving directly to RETROSPECTIVE instead of its normal path?
    options:
    - Task is effectively complete/trivial -- this is a planned early close, not a failure
    - Ending early due to agent or pipeline failure -- needs follow-up documentation
    default: ''
    accepted_answers:
    - Task is effectively complete/trivial -- this is a planned early close, not a failure
    - Ending early due to agent or pipeline failure -- needs follow-up documentation
  - question_id: force_retrospective_authorization
    question: This ends the task early via emergency close, bypassing the normal interview-completeness gate. Type FORCE_RETROSPECTIVE to confirm.
    options:
    - FORCE_RETROSPECTIVE
    default: ''
    accepted_answers:
    - FORCE_RETROSPECTIVE
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released:
  - retrospective_capture
  capabilities_prohibited:
  - push branch to origin
  denial_message: 'Transition INTERVIEW -> RETROSPECTIVE (force) denied: explicit FORCE_RETROSPECTIVE authorization not given.'
  authority:
    type: human_decision
    explanation: A human must explicitly type FORCE_RETROSPECTIVE to end a task early from INTERVIEW, bypassing the normal interview-completeness gate.
