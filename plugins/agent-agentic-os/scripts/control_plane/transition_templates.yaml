- transition_id: draft_plan_to_plan_review
  from_state: DRAFT_PLAN
  to_state: PLAN_REVIEW
  purpose: Submit the authored plan to the PLAN_REVIEW disposition-and-acceptance gate.
  next_steps_hint: "The plan is drafted. Review the plan artifacts (the two documents), then run coordinate-transition --task-id <task-id> --to PLAN_REVIEW and choose what happens next: request independent review, or skip it and continue to plan acceptance. The review choice does not approve implementation. If you request review, the next question selects the reviewer method; after review, you return to PLAN_REVIEW and decide whether to revise or accept. If you skip review, you continue directly to the plan-acceptance question."
  checklist:
  - Current task state is persisted as DRAFT_PLAN
  - Structural DAG transition from DRAFT_PLAN to PLAN_REVIEW is legal
  required_artifacts:
  - docs/plans/<task-id>-spec.md
  - docs/plans/<task-id>-implementation-plan.md
  deterministic_checks: []
  human_questions:
  - question_id: plan_review_disposition
    question: 'The plan is drafted. What would you like to do next?'
    options:
    - No — accept plan as-is and skip independent review [Recommended]
    - Yes — request additional independent review
    accepted_answers:
    - No — accept plan as-is and skip independent review [Recommended]
    - Yes — request additional independent review
    default: No — accept plan as-is and skip independent review [Recommended]
    user_outcomes:
      'yes': Select the review method, then run an independent review round.
      'no': Continue to plan acceptance without independent review.
  approval:
    required: false
    approver_role: agent_or_human
  skip:
    allowed: false
    requires_justification: false
  capabilities_released: []
  capabilities_prohibited:
  - modify production code
  - create implementation worktree
  - push branch to origin
  denial_message: 'Transition DRAFT_PLAN -> PLAN_REVIEW denied: preconditions or required decisions not satisfied.'
  authority:
    type: human_review
    explanation: Entry into PLAN_REVIEW requires human confirmation of review scope and artifacts.
